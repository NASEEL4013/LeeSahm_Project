name: Deploy to Hostinger

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Check artwork preview changes
        id: preview_changes
        run: |
          if ! git diff --quiet HEAD^ HEAD -- public/artworks/previews/; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "base=HEAD^" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet HEAD^ HEAD -- .github/workflows/deploy.yml && ! git diff --quiet HEAD~2 HEAD -- public/artworks/previews/; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "base=HEAD~2" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check Notes series changes
        id: notes_changes
        run: |
          if git diff --quiet HEAD^ HEAD -- public/artworks/notes/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install SFTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Upload artwork previews
        if: steps.preview_changes.outputs.changed == 'true'
        run: |
          git diff --name-only --diff-filter=AM "${{ steps.preview_changes.outputs.base }}" HEAD -- public/artworks/previews/ | while read -r file; do
            local_file="dist/${file#public/}"
            remote_file="/home/$HOSTINGER_USERNAME/domains/leesahm.art/public_html/${file#public/}"
            printf 'put "%s" -o "%s";\n' "$local_file" "$remote_file"
          done > preview-uploads.lftp
          lftp -u "$HOSTINGER_USERNAME,$HOSTINGER_PASSWORD" "sftp://$HOSTINGER_HOST:65002" -e "
            set sftp:auto-confirm yes;
            source preview-uploads.lftp;
            bye
          "
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
      - name: Upload new Wave originals
        if: steps.preview_changes.outputs.changed == 'true'
        run: |
          python scripts/download-new-wave-originals.py --base "${{ steps.preview_changes.outputs.base }}"
          find hostinger-upload/artworks/originals -type f | while read -r file; do
            remote_file="/home/$HOSTINGER_USERNAME/domains/leesahm.art/public_html/artworks/originals/${file##*/}"
            printf 'put "%s" -o "%s";\n' "$file" "$remote_file"
          done > original-uploads.lftp
          lftp -u "$HOSTINGER_USERNAME,$HOSTINGER_PASSWORD" "sftp://$HOSTINGER_HOST:65002" -e "
            set sftp:auto-confirm yes;
            source original-uploads.lftp;
            bye
          "
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
      - name: Upload Notes series
        if: steps.notes_changes.outputs.changed == 'true'
        run: |
          python -m pip install --quiet pillow
          python scripts/prepare-artworks.py --series notes
          lftp -u "$HOSTINGER_USERNAME,$HOSTINGER_PASSWORD" "sftp://$HOSTINGER_HOST:65002" -e "
            set sftp:auto-confirm yes;
            mirror --reverse --only-missing dist/artworks/notes/previews/ /home/$HOSTINGER_USERNAME/domains/leesahm.art/public_html/artworks/notes/previews/;
            mirror --reverse --only-missing hostinger-upload/artworks/notes/originals/ /home/$HOSTINGER_USERNAME/domains/leesahm.art/public_html/artworks/notes/originals/;
            put dist/artworks/notes/data.json -o /home/$HOSTINGER_USERNAME/domains/leesahm.art/public_html/artworks/notes/data.json;
            bye
          "
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
      - name: Upload site over SFTP
        run: |
          lftp -u "$HOSTINGER_USERNAME,$HOSTINGER_PASSWORD" "sftp://$HOSTINGER_HOST:65002" -e "
            set sftp:auto-confirm yes;
            mirror --reverse dist/assets/ /home/$HOSTINGER_USERNAME/domains/leesahm.art/public_html/assets/;
            put dist/artworks/data.json -o /home/$HOSTINGER_USERNAME/domains/leesahm.art/public_html/artworks/data.json;
            put dist/index.html -o /home/$HOSTINGER_USERNAME/domains/leesahm.art/public_html/index.html;
            put dist/404.html -o /home/$HOSTINGER_USERNAME/domains/leesahm.art/public_html/404.html;
            put dist/.htaccess -o /home/$HOSTINGER_USERNAME/domains/leesahm.art/public_html/.htaccess;
            bye
          "
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
